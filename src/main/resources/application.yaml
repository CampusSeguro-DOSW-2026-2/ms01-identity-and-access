spring:
  application:
    name: login
 
  datasource:
    url: jdbc:postgresql://localhost:5432/campus_db
    username: campus_user
    password: campus_password
    driver-class-name: org.postgresql.Driver
 
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
 
server:
  port: 8080
 