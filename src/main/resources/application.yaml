spring:
  application:
    name: login
 
  datasource:
    url: jdbc:postgresql://localhost:5432/campus_db
    username: campus_user
    password: campus_password
    driver-class-name: org.postgresql.Driver
 
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: localhost
    port: 1025

campusseguro:
  recuperacion:
    vigencia-minutos: 15
    max-intentos: 5
    remitente: no-reply@campusseguro.local
 
server:
  port: 8080