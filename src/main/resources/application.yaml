spring:
  application:
    name: ms01-identity-and-access
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus_db}
    username: ${DB_USERNAME:campus_user}
    password: ${DB_PASSWORD:campus_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # Correo real por Gmail (RF-MS01-08): SMTP con STARTTLS en el 587 y la cuenta del proyecto. La contraseña es una
  # contraseña de aplicación de Google y solo llega por MAIL_PASSWORD (nunca en el repositorio)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:proyectometx@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8081
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  # El health refleja MS01 y su BD: una caída del SMTP externo solo afecta la recuperación de contraseña
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

logging:
  pattern:
    console: "%X{correlation_id:-sin-correlacion} %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  key-id: ${JWT_KEY_ID:ms01-2026-01}

gateway:
  url: ${GATEWAY_URL:}
  service-key: ${GATEWAY_SERVICE_KEY:}

internal:
  allowed-services: ${INTERNAL_ALLOWED_SERVICES:ms03,ms05}

identity:
  institutional-domains: ${INSTITUTIONAL_EMAIL_DOMAINS:escuelaing.edu.co,mail.escuelaing.edu.co}

recovery:
  code-ttl-minutes: ${RECOVERY_CODE_TTL_MINUTES:15}
  max-attempts: ${RECOVERY_MAX_ATTEMPTS:5}
  resend-cooldown-seconds: ${RECOVERY_RESEND_COOLDOWN_SECONDS:60}
  # Con Gmail el remitente debe ser la misma cuenta que autentica
  mail-from: ${MAIL_FROM:CampusSeguro <proyectometx@gmail.com>}

bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:}