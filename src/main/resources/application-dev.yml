spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusseguro_db}
    username: ${DB_USER:campus_user}
    password: ${DB_PASSWORD:campus_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true