openapi: 3.0.3
info:
  title: ms01-identity-and-access
  version: 1.0.0
  description: 'Usuarios, autenticación, roles, permisos y sesiones (MS01 - CampusSeguro).


    **Entradas de identidad:** los endpoints protegidos reciben `X-User-Id` y `X-User-Role` (roles separados por coma); todos aceptan `X-Correlation-ID`. Si faltan las de identidad, MS01 responde 401 (RN-MS01-23).


    **Auditoría:** MS01 no expone endpoints de auditoría; emite eventos asíncronos a `ms08-analytics-and-audit` (RNF-MS01-10).'
servers:
  - url: http://localhost:8080/api/v1
    description: Acceso externo (API Gateway)
tags:
  - name: Autenticación y sesión
  - name: Recuperación y cambio de clave
  - name: Perfil propio
  - name: Administración de usuarios
  - name: Roles y permisos
paths:
  /auth/register:
    post:
      tags:
        - Autenticación y sesión
      summary: Registrar usuario institucional (RF-MS01-01, F-01)
      description: Crea el usuario ACTIVO con rol ESTUDIANTE. No inicia sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Correo ya registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                codigo: CONFLICTO
                mensaje: El correo ya está registrado.
                errores: []
                correlation_id: c19b-472d-a12b
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
  /auth/login:
    post:
      tags:
        - Autenticación y sesión
      summary: Autenticar usuario (RF-MS01-02, F-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales incorrectas o cuenta inexistente (respuesta idéntica).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                codigo: CREDENCIALES_INCORRECTAS
                mensaje: Credenciales incorrectas.
                errores: []
                correlation_id: c19b-472d-a12b
        '403':
          description: Cuenta inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                codigo: CUENTA_INACTIVA
                mensaje: Cuenta inactiva. Contacte al administrador.
                errores: []
                correlation_id: c19b-472d-a12b
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
  /auth/logout:
    post:
      tags:
        - Autenticación y sesión
      summary: Cerrar sesión (RF-MS01-04)
      description: Registra el logout (evento a MS08). El cliente descarta el token.
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
  /auth/password/forgot:
    post:
      tags:
        - Recuperación y cambio de clave
      summary: Solicitar código de recuperación (RF-MS01-08, F-04)
      description: Respuesta idéntica exista o no el correo (RN-MS01-20).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Respuesta única.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
              example:
                mensaje: Si el correo está registrado, enviamos un código de recuperación.
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
  /auth/password/reset:
    post:
      tags:
        - Recuperación y cambio de clave
      summary: Restablecer contraseña con código (RF-MS01-08, F-05)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada. El usuario debe iniciar sesión de nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '400':
          description: Código incorrecto, vencido o usado (mensaje genérico) o datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                codigo: CODIGO_INVALIDO
                mensaje: Código incorrecto o vencido.
                errores: []
                correlation_id: c19b-472d-a12b
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
  /users/me/password:
    put:
      tags:
        - Recuperación y cambio de clave
      summary: Cambiar contraseña autenticado (RF-MS01-08, F-06)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '400':
          description: Contraseña actual incorrecta, nueva inválida/igual a la actual o confirmación distinta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
  /users/me:
    get:
      tags:
        - Perfil propio
      summary: Consultar usuario autenticado (RF-MS01-03, RF-MS01-06)
      description: Identifica al usuario por `X-User-Id`.
      responses:
        '200':
          description: Perfil propio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
    put:
      tags:
        - Perfil propio
      summary: Actualizar perfil propio (RF-MS01-06, F-03)
      description: Solo nombres y apellidos. Enviar correo, roles, estado o id se rechaza con 400 (RN-MS01-15).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
  /users:
    get:
      tags:
        - Administración de usuarios
      summary: Listar y buscar usuarios (RF-MS01-07, F-07) - ADMIN, AUDITOR
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - name: correo
          in: query
          description: Búsqueda parcial por correo.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: maria.perez
        - name: estado
          in: query
          description: Omitir equivale a Todos.
          schema:
            $ref: '#/components/schemas/Estado'
        - name: rol
          in: query
          description: Omitir equivale a Todos.
          schema:
            $ref: '#/components/schemas/Rol'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{id}:
    get:
      tags:
        - Administración de usuarios
      summary: Consultar usuario por id (RF-MS01-05, RF-MS01-07) - ADMIN, AUDITOR
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/status:
    patch:
      tags:
        - Administración de usuarios
      summary: Activar/inactivar uno o varios usuarios (RF-MS01-07, F-08) - ADMIN
      description: Operación atómica. Si incluye al propio administrador responde 403; si algún id no existe, 404. En ambos casos no se aplica ningún cambio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: Resultado por usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No es administrador o intenta cambiar su propio estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                codigo: PROHIBIDO
                mensaje: No puede cambiar su propio estado.
                errores: []
                correlation_id: c19b-472d-a12b
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
  /roles:
    get:
      tags:
        - Roles y permisos
      summary: Consultar roles y permisos (RF-MS01-05)
      description: ADMIN recibe el catálogo completo; los demás usuarios solo sus propios roles (según `X-User-Role`).
      responses:
        '200':
          description: Roles con sus permisos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolePermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
  /users/roles:
    patch:
      tags:
        - Roles y permisos
      summary: Agregar/retirar roles a uno o varios usuarios (RF-MS01-05, F-09) - ADMIN
      description: Operación atómica. Si incluye al propio administrador responde 403; si algún id no existe, 404; si algún usuario quedaría sin roles, listas vacías o un rol en ambas listas, 400. En todos
        los casos de error no se aplica ningún cambio.
      parameters:
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRolesRequest'
      responses:
        '200':
          description: Roles resultantes por usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRolesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No es administrador o intenta modificar sus propios roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                codigo: PROHIBIDO
                mensaje: No puede modificar sus propios roles.
                errores: []
                correlation_id: c19b-472d-a12b
        '404':
          $ref: '#/components/responses/NotFound'
components:
  headers:
    XCorrelationID:
      description: UUID generado por el Gateway que enlaza logs y eventos de auditoría.
      schema:
        type: string
        example: c19b-472d-a12b
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: USR-1034
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: Id del usuario autenticado.
      schema:
        type: string
        example: USR-1034
    XUserRole:
      name: X-User-Role
      in: header
      required: true
      description: Roles del usuario autenticado separados por coma.
      schema:
        type: string
        example: ESTUDIANTE,BRIGADISTA
    XCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Identificador de trazabilidad de la petición.
      schema:
        type: string
        example: c19b-472d-a12b
  responses:
    BadRequest:
      description: Validación fallida (indica campo y regla; RG-05).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            codigo: VALIDACION
            mensaje: Datos inválidos.
            errores:
              - campo: primer_nombre
                mensaje: El primer nombre debe tener entre 2 y 30 letras.
            correlation_id: c19b-472d-a12b
    Unauthorized:
      description: Faltan las cabeceras de identidad (X-User-Id / X-User-Role).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: X-User-Role no incluye ADMIN.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Usuario no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            codigo: NO_ENCONTRADO
            mensaje: Usuario no encontrado.
            errores: []
            correlation_id: c19b-472d-a12b
  schemas:
    Estado:
      type: string
      enum:
        - ACTIVO
        - INACTIVO
    Rol:
      type: string
      enum:
        - ESTUDIANTE
        - PROFESOR
        - ADMINISTRATIVO
        - BRIGADISTA
        - COORDINADOR
        - ORGANIZADOR
        - ADMIN
        - AUDITOR
      description: Catálogo de roles (RN-MS01-14).
      example: ESTUDIANTE
    Correo:
      type: string
      format: email
      maxLength: 100
      description: Debe pertenecer al dominio institucional configurado.
      example: maria.perez@escuelaing.edu.co
    Contrasena:
      type: string
      format: password
      minLength: 8
      maxLength: 64
      pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])\S{8,64}$
      description: Mayúscula, minúscula, número y carácter especial; sin espacios.
      example: Campus#2026
    PrimerNombre:
      type: string
      minLength: 2
      maxLength: 30
      pattern: ^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' -]+$
      example: María
    SegundoNombre:
      type: string
      minLength: 2
      maxLength: 30
      pattern: ^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' -]+$
      example: José
    PrimerApellido:
      type: string
      minLength: 2
      maxLength: 30
      pattern: ^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' -]+$
      example: Pérez
    SegundoApellido:
      type: string
      minLength: 2
      maxLength: 30
      pattern: ^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' -]+$
      example: Gómez
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - primer_nombre
        - primer_apellido
        - correo
        - contrasena
        - confirmar_contrasena
      properties:
        primer_nombre:
          $ref: '#/components/schemas/PrimerNombre'
        segundo_nombre:
          $ref: '#/components/schemas/SegundoNombre'
        primer_apellido:
          $ref: '#/components/schemas/PrimerApellido'
        segundo_apellido:
          $ref: '#/components/schemas/SegundoApellido'
        correo:
          $ref: '#/components/schemas/Correo'
        contrasena:
          $ref: '#/components/schemas/Contrasena'
        confirmar_contrasena:
          type: string
          format: password
          example: Campus#2026
          description: Idéntica a contrasena.
    RegisterResponse:
      type: object
      required:
        - id
        - correo
        - roles
        - estado
      properties:
        id:
          type: string
          example: USR-1034
        correo:
          $ref: '#/components/schemas/Correo'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
          example:
            - ESTUDIANTE
        estado:
          $ref: '#/components/schemas/Estado'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - correo
        - contrasena
      properties:
        correo:
          type: string
          format: email
          maxLength: 100
          example: maria.perez@escuelaing.edu.co
        contrasena:
          type: string
          format: password
          minLength: 1
          maxLength: 64
          example: Campus#2026
    LoginResponse:
      type: object
      required:
        - token
        - tipo
        - expira_en
        - usuario
      properties:
        token:
          type: string
          description: JWT firmado.
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJVU1ItMTAzNCJ9.firma
        tipo:
          type: string
          example: Bearer
        expira_en:
          type: string
          format: date-time
          example: '2026-10-20T15:30:00Z'
        usuario:
          type: object
          required:
            - id
            - correo
            - roles
          properties:
            id:
              type: string
              example: USR-1034
            correo:
              $ref: '#/components/schemas/Correo'
            roles:
              type: array
              items:
                $ref: '#/components/schemas/Rol'
              example:
                - ESTUDIANTE
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - correo
      properties:
        correo:
          type: string
          format: email
          maxLength: 100
          example: maria.perez@escuelaing.edu.co
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - correo
        - codigo
        - nueva_contrasena
        - confirmar_nueva_contrasena
      properties:
        correo:
          type: string
          format: email
          maxLength: 100
          example: maria.perez@escuelaing.edu.co
        codigo:
          type: string
          pattern: ^[0-9]{6}$
          example: '482913'
        nueva_contrasena:
          $ref: '#/components/schemas/Contrasena'
        confirmar_nueva_contrasena:
          type: string
          format: password
          example: Campus#2026
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - contrasena_actual
        - nueva_contrasena
        - confirmar_nueva_contrasena
      properties:
        contrasena_actual:
          type: string
          format: password
          minLength: 1
          maxLength: 64
          example: Campus#2026
        nueva_contrasena:
          $ref: '#/components/schemas/Contrasena'
        confirmar_nueva_contrasena:
          type: string
          format: password
          example: Campus#2026
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - primer_nombre
        - primer_apellido
      properties:
        primer_nombre:
          $ref: '#/components/schemas/PrimerNombre'
        segundo_nombre:
          $ref: '#/components/schemas/SegundoNombre'
        primer_apellido:
          $ref: '#/components/schemas/PrimerApellido'
        segundo_apellido:
          $ref: '#/components/schemas/SegundoApellido'
    User:
      type: object
      required:
        - id
        - primer_nombre
        - primer_apellido
        - correo
        - roles
        - estado
      properties:
        id:
          type: string
          example: USR-1034
        primer_nombre:
          $ref: '#/components/schemas/PrimerNombre'
        segundo_nombre:
          $ref: '#/components/schemas/SegundoNombre'
        primer_apellido:
          $ref: '#/components/schemas/PrimerApellido'
        segundo_apellido:
          $ref: '#/components/schemas/SegundoApellido'
        correo:
          $ref: '#/components/schemas/Correo'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
          example:
            - ESTUDIANTE
            - BRIGADISTA
        estado:
          $ref: '#/components/schemas/Estado'
    UserPage:
      type: object
      required:
        - contenido
        - page
        - size
        - total_elementos
        - total_paginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_elementos:
          type: integer
          example: 1
        total_paginas:
          type: integer
          example: 1
    ChangeStatusRequest:
      type: object
      additionalProperties: false
      required:
        - ids
        - estado
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
          example:
            - USR-1034
        estado:
          $ref: '#/components/schemas/Estado'
    ChangeStatusResponse:
      type: object
      required:
        - resultados
      properties:
        resultados:
          type: array
          items:
            type: object
            required:
              - id
              - estado_anterior
              - estado_nuevo
            properties:
              id:
                type: string
                example: USR-1034
              estado_anterior:
                $ref: '#/components/schemas/Estado'
              estado_nuevo:
                $ref: '#/components/schemas/Estado'
    RolePermissions:
      type: object
      required:
        - rol
        - permisos
      properties:
        rol:
          $ref: '#/components/schemas/Rol'
        permisos:
          type: array
          items:
            type: string
          description: Códigos de permiso del rol (ver 3_matriz-roles-permisos.md, RN-MS01-14).
          example:
            - ms02:campus:read
            - ms04:checkin:write
    MensajeResponse:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Operación exitosa.
    ErrorResponse:
      type: object
      description: Cuerpo de error normalizado (RNF-MS01-04), sin trazas internas.
      required:
        - status
        - codigo
        - mensaje
      properties:
        status:
          type: integer
          example: 400
        codigo:
          type: string
          example: VALIDACION
        mensaje:
          type: string
        errores:
          type: array
          items:
            type: object
            required:
              - campo
              - mensaje
            properties:
              campo:
                type: string
              mensaje:
                type: string
        correlation_id:
          type: string
          example: c19b-472d-a12b
    ChangeRolesRequest:
      type: object
      additionalProperties: false
      required:
        - ids
      anyOf:
        - required:
            - agregar
        - required:
            - retirar
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
          example:
            - USR-1034
        agregar:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Rol'
          example:
            - BRIGADISTA
        retirar:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Rol'
          example:
            - PROFESOR
    ChangeRolesResponse:
      type: object
      required:
        - resultados
      properties:
        resultados:
          type: array
          items:
            type: object
            required:
              - id
              - roles
            properties:
              id:
                type: string
                example: USR-1034
              roles:
                type: array
                items:
                  $ref: '#/components/schemas/Rol'
                example:
                  - ESTUDIANTE
                  - BRIGADISTA