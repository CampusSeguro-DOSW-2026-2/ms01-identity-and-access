services:
  db:
    image: postgres:17-alpine
    container_name: campus-postgres
    environment:
      POSTGRES_DB: campus_db
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_password
    ports:
      - "5432:5432"
    volumes:
      - campus-postgres-data:/var/lib/postgresql/data
 
volumes:
  campus-postgres-data:
    external: true
 