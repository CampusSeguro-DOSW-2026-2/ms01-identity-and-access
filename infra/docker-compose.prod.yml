# MS01 stack in the cloud: one per environment on the same VM (ms01-prod and ms01-test). MS01 is stateless: the data of
# each environment lives in its own database of Amazon RDS, which only accepts connections from this VM.
# It publishes no ports: only the edge Caddy of the VM (campus-edge network) reaches MS01, with the alias ms01-<environment>.
# It is used by infra/deploy.sh with the .env it writes in DEPLOY_DIR/<environment>; it is not run by hand.
name: ms01-${ENTORNO:?ENTORNO is required (test or prod)}

services:
  ms01:
    image: ${IMAGE:?IMAGE is required}:${TAG:?TAG is required (sha-xxxxxxx)}
    restart: unless-stopped
    environment:
      # Amazon RDS (PostgreSQL 18) of the environment, with TLS verified against the AWS CA that deploy.sh downloads.
      DB_URL: jdbc:postgresql://${DB_HOST:?DB_HOST is required (RDS endpoint)}:5432/${DB_NAME:?DB_NAME is required}?sslmode=verify-full&sslrootcert=/certs/rds-ca.pem
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-ms01-2026-01}
      GATEWAY_URL: ${GATEWAY_URL:?GATEWAY_URL is required (https://<domain of the GW> or :8443)}
      GATEWAY_SERVICE_KEY: ${GATEWAY_SERVICE_KEY:?GATEWAY_SERVICE_KEY is required}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-proyectometx@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required (Gmail application password)}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: "true"
      MAIL_FROM: ${MAIL_FROM:-CampusSeguro <proyectometx@gmail.com>}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: "false"
      # The health reflects MS01 and its database: a failure of the external SMTP only affects the emails with codes.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    # Optional variables of the environment (e.g. INTERNAL_ALLOWED_SERVICES, REGISTRATION_*, RECOVERY_*), if there are any.
    env_file:
      - path: extra.env
        required: false
    volumes:
      - ./rds-ca.pem:/certs/rds-ca.pem:ro
    networks:
      edge:
        aliases:
          - ms01-${ENTORNO}

networks:
  edge:
    name: campus-edge
    external: true
