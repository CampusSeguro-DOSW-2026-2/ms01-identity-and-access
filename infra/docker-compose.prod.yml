# MS01 stack in the cloud: one per environment on the same VM (ms01-prod and ms01-test), each one with its DB.
# It publishes no ports: only the edge Caddy of the VM (campus-edge network) reaches MS01, with the alias ms01-<environment>,
# and the DB is only visible inside the stack. It is used by infra/deploy.sh with the .env it writes in DEPLOY_DIR/<environment>;
# it is not run by hand.
name: ms01-${ENTORNO:?ENTORNO is required (test or prod)}

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_db
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - datos:/var/lib/postgresql/data
      # Initial schema (database/*.sql): Postgres only runs it the first time, with the empty volume.
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - interna

  ms01:
    image: ${IMAGE:?IMAGE is required}:${TAG:?TAG is required (sha-xxxxxxx)}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/campus_db
      DB_USERNAME: campus_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_KEY_ID: ${JWT_KEY_ID:-ms01-2026-01}
      GATEWAY_URL: ${GATEWAY_URL:?GATEWAY_URL is required (https://<domain of the GW> or :8443)}
      GATEWAY_SERVICE_KEY: ${GATEWAY_SERVICE_KEY:?GATEWAY_SERVICE_KEY is required}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-proyectometx@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required (Gmail application password)}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: "true"
      MAIL_FROM: ${MAIL_FROM:-CampusSeguro <proyectometx@gmail.com>}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: "false"
      # The health reflects MS01 and its DB: a failure of the external SMTP only affects the emails with codes.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    # Optional variables of the environment (e.g. INTERNAL_ALLOWED_SERVICES, REGISTRATION_*, RECOVERY_*), if there are any.
    env_file:
      - path: extra.env
        required: false
    networks:
      interna:
      edge:
        aliases:
          - ms01-${ENTORNO}

volumes:
  datos:

networks:
  interna:
  edge:
    name: campus-edge
    external: true
