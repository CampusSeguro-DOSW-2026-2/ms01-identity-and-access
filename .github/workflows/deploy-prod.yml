name: Desplegar a producción

# CD to production: manual, only from main and with the approval required by the ms01-prod Environment.
# It promotes the same image that already went through test (sha-xxxxxxx), without rebuilding it. Another earlier tag = rollback.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image to promote (sha-xxxxxxx), the same one that was already tested in test
        type: string
        required: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Only from main and with a sha-xxxxxxx tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Production is only deployed from main (received: $GITHUB_REF)"; exit 1; }
          [[ "$TAG" =~ ^sha-[0-9a-f]{7}$ ]] || { echo "::error::The tag must have the form sha-xxxxxxx (received: $TAG)"; exit 1; }

  desplegar:
    needs: verificar
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      entorno: prod
      ref: ${{ github.sha }}
      tag: ${{ inputs.tag }}
    secrets: inherit
