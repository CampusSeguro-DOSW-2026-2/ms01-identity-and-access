name: Desplegar

# Reusable workflow: deploys an already published image on the MS01 VM, with the self-hosted runner labeled
# "ms01" and the variables and secrets of the ms01-<environment> Environment. It is called by ci.yml (test) and deploy-prod.yml.
on:
  workflow_call:
    inputs:
      entorno:
        description: test or prod
        type: string
        required: true
      ref:
        description: Commit from which the files of infra/ and database/ are taken
        type: string
        required: true
      tag:
        description: Image to deploy (sha-xxxxxxx). Empty = the one of the ref commit.
        type: string
        required: false
        default: ''

jobs:
  desplegar:
    runs-on: [self-hosted, ms01]
    environment: ms01-${{ inputs.entorno }}
    timeout-minutes: 15
    concurrency:
      group: desplegar-ms01-${{ inputs.entorno }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Deploy and verify
        run: infra/deploy.sh
        env:
          ENTORNO: ${{ inputs.entorno }}
          TAG: ${{ inputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
          MS01_EXTRA_ENV: ${{ vars.MS01_EXTRA_ENV }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          GATEWAY_SERVICE_KEY: ${{ secrets.GATEWAY_SERVICE_KEY }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
